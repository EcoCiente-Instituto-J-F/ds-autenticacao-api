name: CI - ds-autenticacao-api

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build e testes

    # Runner estabilizado durante a migracao ubuntu-latest para 26.04.
    runs-on: ubuntu-24.04

    timeout-minutes: 25

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Dar permissao ao Gradle Wrapper
        run: chmod +x gradlew

      - name: Verificar Docker
        run: |
          docker version
          docker info

      # Compatibilidade do docker-java/Testcontainers 1.x com Docker Engine 29.
      # Configuracao do runner; nao alterar o ambiente local dos devs.
      - name: Ajustar API Docker dos testes
        run: |
          mkdir -p src/test/resources
          printf '%s\n' 'api.version=1.44' > src/test/resources/docker-java.properties

      - name: Executar build e testes
        run: ./gradlew clean build --no-daemon

  publish-image:
    name: Publicar imagem Docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Preparar imagem
        id: image
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk -F"'" '/^version = / { print $2; exit }' build.gradle)"
          if ! [[ "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::Versao invalida no build.gradle: $VERSION"
            exit 1
          fi
          IMAGE="ecociente/ecociente:autenticacao-$VERSION"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Imagem esperada: $IMAGE"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verificar imutabilidade da tag
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          set +e
          OUTPUT="$(docker buildx imagetools inspect "$IMAGE" 2>&1)"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::Imagem $IMAGE ja existe. Nao sobrescrever tags imutaveis."
            exit 1
          fi
          if echo "$OUTPUT" | grep -Eqi 'not found|manifest unknown|no such manifest'; then
            echo "Tag disponivel: $IMAGE"
            exit 0
          fi
          echo "$OUTPUT"
          echo "::error::Nao foi possivel confirmar disponibilidade da tag."
          exit 1

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.image }}

      - name: Resumo
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: echo "Imagem publicada: $IMAGE"
